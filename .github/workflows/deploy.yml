name: Provision and Deploy Static Website

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "infra/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

env:
  RESOURCE_GROUP: trip-centric-rg
  DEPLOYMENT_NAME: trip-centric-deployment

jobs:
  provision-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: >
            {
              "clientId":"${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId":"${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Validate Bicep
        run: |
          az deployment group validate \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep

      - name: Provision Azure infrastructure
        id: infrastructure
        run: |
          OUTPUTS=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "$DEPLOYMENT_NAME" \
            --template-file infra/main.bicep \
            --query properties.outputs \
            --output json)

          APP_NAME=$(echo "$OUTPUTS" | jq -r '.staticWebAppName.value')
          WEBSITE_URL=$(echo "$OUTPUTS" | jq -r '.websiteUrl.value')

          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "website_url=$WEBSITE_URL" >> "$GITHUB_OUTPUT"

      - name: Get Static Web App deployment token
        id: deployment-token
        shell: bash
        run: |
          DEPLOYMENT_TOKEN=$(az staticwebapp secrets list \
            --name "${{ steps.infrastructure.outputs.app_name }}" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.apiKey" \
            --output tsv)

          echo "::add-mask::$DEPLOYMENT_TOKEN"
          echo "token=$DEPLOYMENT_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy website
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.deployment-token.outputs.token }}
          action: upload
          app_location: /
          api_location: ""
          output_location: ""
          skip_app_build: true

      - name: Show website URL
        run: |
          echo "Deployment completed successfully."
          echo "Website: ${{ steps.infrastructure.outputs.website_url }}"
